version: '3.8'

services:
  backend:
    build: .
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: eve_user
      POSTGRES_PASSWORD: eve_password
      POSTGRES_DB: eve_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eve_user -d eve_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
